[project]
name = "mdforge"
version = "0.1.0"
description = "MdForge - PDF to Markdown desktop converter with multiple parsers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "markitdown[all]>=0.1.5",
    "pyside6>=6.11.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mdforge = "mdforge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-qt>=4.4.0"]
